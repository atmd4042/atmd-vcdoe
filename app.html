.splash-name{margin:8px 0 0;font-family:"Alexandria",Tahoma,sans-serif;font-size:clamp(40px,8vw,62px);font-weight:800;letter-spacing:-2px;color:#f6d77f;text-shadow:0 0 32px #d4a0174d}

.splash-loading i{width:5px;height:5px;border-radius:50%;background:#d4a017;box-shadow:0 0 12px #d4a017;animation:loading-pulse 1s ease-in-out infinite}
.splash-loading i:nth-child(2){animation-delay:.16s}.splash-loading i:nth-child(3){animation-delay:.32s}
.splash-skip{position:absolute;z-index:2;bottom:28px;left:50%;transform:translateX(-50%);border:1px solid #d4a0173d;border-radius:999px;padding:8px 15px;background:#ffffff08;color:#c8c2b4;font:inherit;font-size:10px;transition:background .2s,color .2s}
.splash-skip:hover{background:#d4a01720;color:#f6d77f}
.splash-particle{position:absolute;width:3px;height:3px;border-radius:50%;background:#e1b73e;box-shadow:0 0 13px 2px #d4a01777;animation:particle-drift var(--duration,7s) ease-in-out infinite alternate}
.splash-particle:nth-of-type(1){top:18%;left:24%;--duration:8s}.splash-particle:nth-of-type(2){top:27%;left:77%;--duration:6.4s}.splash-particle:nth-of-type(3){top:74%;left:19%;--duration:7.3s}.splash-particle:nth-of-type(4){top:79%;left:73%;--duration:9s}.splash-particle:nth-of-type(5){top:38%;left:12%;--duration:6s}.splash-particle:nth-of-type(6){top:57%;left:86%;--duration:8.4s}.splash-particle:nth-of-type(7){top:14%;left:58%;--duration:7.6s}.splash-particle:nth-of-type(8){top:88%;left:46%;--duration:6.8s}
@keyframes splash-arrive{from{opacity:0;transform:translateY(18px) scale(.94);filter:blur(9px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}

function readAccounts(){try{return JSON.parse(localStorage.getItem('etemad-users')||'[]')}catch{return []}}

async function hashPassword(password){const bytes=new TextEncoder().encode(password);const digest=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(digest)].map(byte=>byte.toString(16).padStart(2,'0')).join('')}

function initializeApp(){document.body.classList.toggle('dark',theme==='dark');const email=localStorage.getItem('etemad-session');const account=readAccounts().find(item=>item.email===email);if(account){enterApp(account)}else{localStorage.removeItem('etemad-session');showAuth('login')}}
function render(){const pages={home:dashboard,services:serviceCatalog,orders:ordersPage,appointments:appointmentsPage,payments:paymentsPage,notifications:notificationsPage,support:supportPage,profile:profilePage,settings:settingsPage,admin:adminPage,secrets:secretsPage};root.innerHTML=(pages[activeView]||dashboard)();document.getElementById('crumbName').textContent=titles[activeView]||'الرئيسية';document.querySelectorAll('[data-view]').forEach(button=>button.classList.toggle('active',button.dataset.view===activeView));document.getElementById('orderCount').textContent=orders.length;const name=currentUser?.profile?.name||'حساب العميل';document.getElementById('accountName').textContent=name;document.getElementById('accountEmail').textContent=currentUser?.email||'';document.getElementById('accountInitial').textContent=name.trim().charAt(0)||'ع';const greeting=root.querySelector('.welcome h1');if(greeting)greeting.textContent=`مرحبًا ${name}،`;if(activeView==='profile'&&currentUser?.profile){const inputs=root.querySelectorAll('#profileForm input');inputs[0].value=currentUser.profile.name||'';inputs[1].value=currentUser.profile.phone||'';inputs[2].value=currentUser.profile.email||currentUser.email;inputs[3].value=currentUser.profile.identity||''}}
function showToast(message){const toast=document.getElementById('toast');toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2400)}
function openModal(title,content){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=content;modal.classList.add('open');document.body.style.overflow='hidden';const focusable=modal.querySelector('input,select,textarea,button');if(focusable)focusable.focus()}
function closeModal(){modal.classList.remove('open');document.body.style.overflow=''}
function newRequest(serviceId=''){openModal('إنشاء طلب خدمة',`<form id="requestForm"><div class="form-grid"><div class="field full"><label for="requestService">الخدمة</label><select id="requestService" required><option value="">اختر الخدمة</option>${services.map(s=>`<option value="${s.id}" ${s.id===serviceId?'selected':''}>${s.name}</option>`).join('')}</select></div><div class="field full"><label for="requestDetails">تفاصيل الطلب</label><textarea id="requestDetails" placeholder="اكتب وصفًا مختصرًا لما تحتاج إليه..."></textarea></div><div class="field full"><label>المرفقات</label><div class="file-drop">أرفق صورًا أو ملفات PDF (حد أقصى 10 ميغابايت)<input id="requestFiles" type="file" accept="image/*,.pdf" multiple></div></div></div><div class="secure-note">لا ترفق مستندات أصلية أو شديدة الحساسية في هذه النسخة التجريبية؛ الملفات لا تُرفع إلى خادم.</div><div class="modal-actions"><button class="primary" type="submit">إرسال الطلب</button><button class="ghost" type="button" data-modal-close>إلغاء</button></div></form>`)}
function orderDetails(id){const order=orders.find(item=>item.id===id);if(!order)return;openModal('تفاصيل الطلب',`<div class="appointment"><div class="date-chip"><b>١٢</b><small>أكتوبر</small></div><div><strong>${esc(order.service)}</strong><p>رقم الطلب ${esc(order.id)}</p></div></div><div style="margin:17px 0">${statusHtml(order.status,order.tone)}</div><div class="activity"><div class="activity-row"><span class="activity-icon">✓</span><div><b>تم استلام الطلب</b><p>وصل طلبك إلى فريق اعتمد.</p><small>${esc(order.date)}</small></div></div><div class="activity-row"><span class="activity-icon">◷</span><div><b>${esc(order.status)}</b><p>نعمل على تحديث حالة المعاملة، وستصلك إشعارات بأي مستجد.</p></div></div></div><div class="modal-actions"><button class="secondary" data-action="upload">رفع مستند</button><button class="ghost" data-modal-close>إغلاق</button></div>`)}
function uploadModal(){openModal('رفع مستندات',`<div class="file-drop">اختر الملفات المطلوبة (صور أو PDF)<input type="file" accept="image/*,.pdf" multiple></div><div class="secure-note">نموذج محلي: لن تُرسل الملفات إلى أي مكان.</div><div class="modal-actions"><button class="primary" data-action="confirm-upload">إرفاق الملفات</button></div>`)}
function appointmentModal(){openModal('حجز موعد',`<form id="appointmentForm"><div class="form-grid"><div class="field"><label>نوع الموعد</label><select><option>استشارة خدمات</option><option>متابعة طلب</option></select></div><div class="field"><label>التاريخ</label><input type="date" required></div><div class="field"><label>الوقت المناسب</label><select><option>١٠:٠٠ صباحًا</option><option>١١:٣٠ صباحًا</option><option>١:٠٠ مساءً</option></select></div><div class="field"><label>طريقة التواصل</label><select><option>مكالمة مرئية</option><option>اتصال هاتفي</option></select></div></div><div class="modal-actions"><button class="primary">تأكيد الموعد</button></div></form>`)}
document.addEventListener('click',event=>{const authMode=event.target.closest('[data-auth-mode]');if(authMode){showAuth(authMode.dataset.authMode);return}const view=event.target.closest('[data-view]');if(view){activeView=view.dataset.view;if(activeView==='secrets'&&!adminMode){showToast('هذا القسم متاح للمدير الرئيسي فقط');return}render();return}const service=event.target.closest('[data-service]');if(service){newRequest(service.dataset.service);return}const action=event.target.closest('[data-action]');if(action){const kind=action.dataset.action;if(kind==='new-request')newRequest();if(kind==='appointment')appointmentModal();if(kind==='upload')uploadModal();if(kind==='confirm-upload'){closeModal();showToast('تم إرفاق الملفات في نموذج المعاينة')}if(kind==='invoice')showToast('تحميل الفواتير غير مفعّل في النسخة التجريبية');if(kind==='new-chat')showToast('ميزة المحادثة تحتاج إلى ربط خدمة خلفية');if(kind==='terms')openModal('اتفاقية الاستخدام',`<p style="font-size:10px;line-height:2;color:var(--muted)">تُعد أساليب العمل والإجراءات والنماذج والعمليات الداخلية والأنظمة المستخدمة داخل تطبيق اعتمد ملكية فكرية وأسرارًا تجارية خاصة بمالك التطبيق، ولا يجوز نسخها أو إعادة استخدامها أو مشاركتها أو استخراجها دون إذن مسبق. لا تمثل هذه الموافقة بديلًا عن شروط استخدام وسياسة خصوصية مراجعتين قانونيًا.</p><label class="toggle-row"><span>أوافق على اتفاقية الاستخدام</span><input type="checkbox" class="switch"></label>`);if(kind==='leave-admin'){adminMode=false;activeView='home';render()}return}const order=event.target.closest('[data-order]');if(order){orderDetails(order.dataset.order);return}const secret=event.target.closest('[data-secret]');if(secret){secretLog.unshift(`${new Date().toLocaleString('ar-SA')} — ${secret.dataset.secret} — جلسة المعاينة`);render();showToast('سُجل الحدث في سجل المعاينة');return}if(event.target.closest('[data-modal-close]'))closeModal()});
document.getElementById('sideNav').addEventListener('click',()=>{});document.getElementById('logoutButton').addEventListener('click',()=>{saveAccount();currentUser=null;orders=[];adminMode=false;localStorage.removeItem('etemad-session');showAuth('login')});document.getElementById('adminToggle').addEventListener('click',()=>{adminMode=true;activeView='admin';render();showToast('وضع الإدارة التجريبي، غير محمي')});document.getElementById('themeToggle').addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';document.body.classList.toggle('dark',theme==='dark');localStorage.setItem('etemad-theme',theme);if(activeView==='settings')render()});modal.addEventListener('click',event=>{if(event.target===modal||event.target.closest('#modalClose')||event.target.closest('[data-modal-close]'))closeModal()});document.addEventListener('keydown',event=>{if(event.key==='Escape')closeModal()});
root.addEventListener('input',event=>{if(event.target.id==='serviceSearch'){searchText=event.target.value;const pos=event.target.selectionStart;render();const input=document.getElementById('serviceSearch');input.focus();input.setSelectionRange(pos,pos)}if(event.target.id==='orderSearch'||event.target.id==='orderFilter')filterOrders()});root.addEventListener('change',event=>{if(event.target.id==='categorySelect'){selectedCategory=event.target.value;render()}if(event.target.id==='darkSwitch'){theme=event.target.checked?'dark':'light';document.body.classList.toggle('dark',event.target.checked);localStorage.setItem('etemad-theme',theme)}});
function filterOrders(){const query=(document.getElementById('orderSearch')?.value||'').trim();const status=document.getElementById('orderFilter')?.value||'كل الحالات';const filtered=orders.filter(order=>(!query||`${order.id} ${order.service}`.includes(query))&&(status==='كل الحالات'||order.status===status));const list=document.getElementById('ordersList');if(list)list.innerHTML=requestRows(filtered)}
document.addEventListener('submit',async event=>{const form=event.target;if(['loginForm','registerForm','forgotForm'].includes(form.id)){event.preventDefault();const error=document.getElementById('authError');const fail=message=>{error.textContent=message;error.hidden=false};const email=(document.getElementById('authEmail')?.value||'').trim().toLowerCase();if(form.id==='forgotForm'){showAuth('forgot','استعادة كلمة المرور تحتاج إلى إرسال رابط عبر Firebase أو خدمة بريد مهيأة. لم يتم إرسال رسالة من هذا النموذج.');return}try{const password=document.getElementById('authPassword').value;const passwordHash=await hashPassword(password);const accounts=readAccounts();if(form.id==='registerForm'){const name=document.getElementById('authName').value.trim();const phone=document.getElementById('authPhone').value.trim();if(password!==document.getElementById('authConfirm').value){fail('كلمتا المرور غير متطابقتين.');return}if(password.length<8){fail('استخدم كلمة مرور من ٨ أحرف على الأقل.');return}if(!document.getElementById('authTerms').checked){fail('يجب الموافقة على اتفاقية الاستخدام.');return}if(accounts.some(account=>account.email===email)){fail('يوجد حساب بهذا البريد. سجّل الدخول بدلاً من ذلك.');return}const account={email,passwordHash,profile:{name,phone,email,identity:''},orders:[],createdAt:new Date().toISOString()};accounts.push(account);localStorage.setItem('etemad-users',JSON.stringify(accounts));enterApp(account);showToast('تم إنشاء حسابك وحفظه على هذا المتصفح');return}const account=accounts.find(item=>item.email===email&&item.passwordHash===passwordHash);if(!account){fail('البريد الإلكتروني أو كلمة المرور غير صحيحة.');return}enterApp(account);showToast('تم تسجيل الدخول')}catch{fail('تعذر إكمال العملية في هذا المتصفح. استخدم خادماً محلياً أو اربط Firebase.')}return}if(form.id==='requestForm'){event.preventDefault();const service=services.find(item=>item.id===document.getElementById('requestService').value);if(!service){showToast('اختر الخدمة أولًا');return}const files=document.getElementById('requestFiles').files;if([...files].some(file=>file.size>10*1024*1024)){showToast('حجم الملف يتجاوز ١٠ ميغابايت');return}orders.unshift({id:`AD-${2050+orders.length}`,service:service.name,date:new Date().toLocaleDateString('ar-SA'),status:'جديد',tone:''});saveAccount();closeModal();activeView='orders';render();showToast('تم حفظ الطلب على هذا المتصفح')}if(form.id==='appointmentForm'){event.preventDefault();closeModal();showToast('تم حفظ الموعد في نموذج المعاينة')}if(form.id==='profileForm'){event.preventDefault();const inputs=form.querySelectorAll('input');currentUser.profile={...currentUser.profile,name:inputs[0].value.trim(),phone:inputs[1].value.trim(),email:inputs[2].value.trim(),identity:inputs[3].value.trim()};saveAccount();render();showToast('تم حفظ بيانات الملف على هذا المتصفح')}});
function paymentWhatsAppUrl(order){const customerName=currentUser?.profile?.name?.trim()||'العميل';const message=`السلام عليكم ورحمة وبركاتة انا العميل(${customerName}) ارغب في اتمام العمليه (${order.service}) وارسلو لي حسابكم البنكي لكي نتمم العمليه`;return `https://wa.me/966559384584?text=${encodeURIComponent(message)}`}
document.addEventListener('click',event=>{const orderButton=event.target.closest('[data-order]');if(!orderButton)return;const order=orders.find(item=>item.id===orderButton.dataset.order),body=document.getElementById('modalBody');if(!order||!body)return;let actions=body.querySelector('.modal-actions');if(!actions){actions=document.createElement('div');actions.className='modal-actions';body.append(actions)}const link=document.createElement('a');link.className='primary';link.href=paymentWhatsAppUrl(order);link.target='_blank';link.rel='noopener noreferrer';link.textContent='متابعة إتمام الطلب عبر واتساب';actions.append(link)});
const futureSplash=document.getElementById('futureSplash');let splashTimer;function hideFutureSplash(){if(!futureSplash)return;window.clearTimeout(splashTimer);futureSplash.classList.add('leaving');window.setTimeout(()=>futureSplash.remove(),700)}document.getElementById('splashSkip').addEventListener('click',hideFutureSplash);if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){hideFutureSplash()}else{splashTimer=window.setTimeout(hideFutureSplash,2500)}
document.body.classList.add('future-ui');if(!localStorage.getItem('etemad-theme'))theme='dark';document.body.classList.toggle('luxe-light',theme==='light');document.getElementById('themeToggle').addEventListener('click',()=>document.body.classList.toggle('luxe-light',theme==='light'));
</script>
